<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐦 Twitter Feed</h1>
            <p>Search and display tweets</p>
        </div>

        <div class="auth-section">
            <h3>Authentication</h3>
            <div class="form-group">
                <label>Auth Token:</label>
                <input type="password" id="authToken" placeholder="Enter auth_token from cookies">
            </div>
            <div class="form-group">
                <label>CT0 Token:</label>
                <input type="password" id="ct0Token" placeholder="Enter ct0 from cookies">
            </div>
            <div class="form-group">
                <label>Full Cookie String:</label>
                <textarea id="cookieString" placeholder="Paste full cookie string from browser"></textarea>
            </div>
            <button id="testAuth" class="btn btn-secondary">Test Authentication</button>
            <button id="extractCookies" class="btn btn-primary">Auto Extract from Twitter</button>
        </div>

        <div class="search-section">
            <h3>Search Tweets</h3>
            <div class="search-controls">
                <div class="form-group">
                    <label>Search Query:</label>
                    <input type="text" id="searchQuery" value="twitter" placeholder="Enter search term">
                </div>
                <div class="form-group">
                    <label>Tweet Type:</label>
                    <select id="tweetType">
                        <option value="Latest">Latest</option>
                        <option value="Top">Top</option>
                        <option value="Live">Live</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Limit:</label>
                    <input type="number" id="tweetLimit" value="10" min="1" max="50">
                </div>
            </div>
            <button id="searchTweets" class="btn btn-primary" disabled>Search Tweets</button>
        </div>

        <div id="status" class="status"></div>

        <div id="results" class="results"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
