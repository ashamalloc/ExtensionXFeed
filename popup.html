<!DOCTYPE html>
<html>
<head>
  <title>Feed Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 300px;
    }
    input, button {
      padding: 5px;
      margin-top: 5px;
      width: 100%;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    li {
      background: #f0f0f0;
      padding: 5px;
      margin-bottom: 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>Twitter Feed</h2>
  <input type="text" id="screenName" placeholder="elonmusk" />
  <button id="fetch">Fetch</button>
  <ul id="tweets"></ul>

  <script src="popup.js"></script>
</body>
</html>
